<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 資優班年度梗圖大賞</title>
    
    <!-- 基礎樣式與核心庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Firebase 核心 (Compat 版本) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        body { background-color: #0f172a; color: white; margin: 0; font-family: system-ui, sans-serif; overflow-x: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .card-selected { transform: scale(0.96); box-shadow: 0 0 0 4px #ec4899; z-index: 10; }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #ec4899; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .input-glow:focus { box-shadow: 0 0 15px rgba(236, 72, 153, 0.5); border-color: #ec4899; outline: none; }
    </style>
</head>
<body>

    <div id="root">
        <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #94a3b8;">
            <div class="loader" style="width: 40px; height: 40px; margin-bottom: 20px;"></div>
            <div>系統啟動中...</div>
        </div>
    </div>

    <script type="text/babel">
        // ==========================================
        //  設定區域
        // ==========================================

        const ADMIN_PASSWORD = "admin888"; // ★★★ 管理員重置密碼 (請自行修改) ★★★

        const firebaseConfig = {
            apiKey: "AIzaSyDe-m-4ZQY5ygJWpC3Q7itoWHPs4uzbadY",
            authDomain: "happy-a79dd.firebaseapp.com",
            projectId: "happy-a79dd",
            storageBucket: "happy-a79dd.firebasestorage.app",
            messagingSenderId: "430340297828",
            appId: "1:430340297828:web:4995ea27ea30bfadb3fb71"
        };

        const PHOTO_IDS = [
            "1mCnYb4S1kuTe1B7YUoq6ArURQTe5qd1g", "1dUWWSVf9Onp0lLJrK07z1-dPE84vsOgj", "1BbNht3rZ9FKvth96cOnmi765_yJ5gybJ",
            "1dNKWF1iqWGLNdQ5N8VHZbLC3SPKasD5S", "1BLogX7zHBvVKrYMS_wUbvXFS67oZ2RXy", "1Mst0-I1migSLI7EiSP1yHcRuCwc9z60R",
            "1ElsbKhTpNYvCm3o7bap4YAvhFMHZFXPR", "18yrSvjmGavaT026VooDxToRkYG6LmaLK", "1T24-fFroOs0cMfrj84S4i_oyu_LYbq7D",
            "1ZDpt6MguJUsax-UY34wIArflSnkf-Snf", "1G2jFPTQy9ehestEUquxi-Gh-7QH1HLpr", "1TWy8a0fh1iLhfJNX_SseRCNu95Az3Lze",
            "1HLG4OMUGsekOh2zeT6q2WprVgQR49qIi", "11WdXaj3aHuBmBdpPoZPUjGCZ7iqU0rbk", "1kPUe3rn46E7Z5tiQCFIa_B_8-7AsPOZo",
            "1nQBOYzNB-eA6puPgP4Ne4eeA28hNa3Nw", "1h0NYurvyYIiAI-c1Miow7ivHp1sqIx1n", "1H_xn29OOViYdBe3hcLiYZ7rHC4x9NmPL",
            "1TBHFXkqX-YromuzZmX4qi_ZknZGffkho", "16yJigA7wsXiSZMzfQZeQfVHJ2XHqyhHh", "1WRfnA28hye0n0HIWkE07QcwytGtIJJqP",
            "1V9twJ6qYvXqrxm06fFOzf95wrVTAKVyu", "10L1LiOaqby0gv-ZPG54FzlRQrWm7p4HZ", "1uUlUJgiaBMQV_zcmbmHj_pkw4pwZbZc2",
            "1ThfQ7RZFZ-pPOCmBj-xOcOFWCA0ExqHe", "1yYb-EQtskGIuYxkEVtH_tU5728oOUHtp", "1j1oIBZI0nisgptAkQnMA08hI5rd5M0ng",
            "1fiNbYcCASKrC6IiWex0Kty1qK1nfoEO2", "1-r0RAZN2EnR41URD0nAsA3J56PoAJloP", "16Lryo_Z_HmCfqTt3LYDhSDycgQIQa_RC",
            "1Zfj2HuXdAHPg8ceGFpeZcJVig4JoRnQ3", "1kw2QmHHWShZWUsYWPvytgAJiAvUPVfT4", "1aLnnu9rdz4P42Fjgv-vsJliX8TssskQR",
            "1YbR0Qe6SlJhWhrDEjr0wAPai4bVWe0NK", "1fyaFdn67r5c8YuSmLk63Tjl1B4OdzXtV", "1qiCwGZi3Q5YorHVKGg_tZ44NHiSN2jsf",
            "1RE_Np5Jn-rsgOume1o2sD1sMuPb8OCTo", "1Roz3oj4hGT5YN5F_GbbSTYa5IGqxDaQM"
        ];

        // 初始化 Firebase
        let db = null;
        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
        } catch (e) { console.error(e); }

        const { useState, useEffect, useMemo } = React;
        const COLLECTION_PATH = "meme_vote_2025_records"; // 存放投票資料的集合名稱

        const MEME_DATA = PHOTO_IDS.map((id, i) => ({
            id: i + 1,
            url: `https://lh3.googleusercontent.com/d/${id}=s800`,
            title: `年度梗圖 #${i + 1}`,
        }));

        // --- 登入畫面組件 ---
        const LoginScreen = ({ onLogin }) => {
            const [name, setName] = useState("");
            const [error, setError] = useState("");

            const handleSubmit = (e) => {
                e.preventDefault();
                const cleanName = name.trim();
                if (!cleanName) {
                    setError("請輸入名字或座號");
                    return;
                }
                // 簡單防呆：名字太短
                if (cleanName.length < 2) {
                    setError("名字太短囉，請輸入完整姓名");
                    return;
                }
                onLogin(cleanName);
            };

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                    <div className="max-w-md w-full glass-panel p-8 rounded-3xl shadow-2xl text-center border border-white/10">
                        <div className="mb-6 inline-block p-4 rounded-full bg-pink-500/10 text-pink-500">
                            <i className="fas fa-user-astronaut text-4xl"></i>
                        </div>
                        <h2 className="text-2xl font-black text-white mb-2">歡迎來到梗圖大賞</h2>
                        <p className="text-slate-400 mb-8 text-sm">請輸入您的真實姓名或座號以開始投票<br/>(每人僅限投票一次)</p>
                        
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div className="relative">
                                <input 
                                    type="text" 
                                    value={name}
                                    onChange={(e) => {setName(e.target.value); setError("");}}
                                    placeholder="例如：01王小明" 
                                    className="w-full bg-slate-800/50 border border-slate-600 text-white px-5 py-4 rounded-xl text-lg text-center focus:border-pink-500 transition-all outline-none input-glow placeholder-slate-600"
                                />
                            </div>
                            {error && <div className="text-red-400 text-sm animate-pulse"><i className="fas fa-exclamation-circle"></i> {error}</div>}
                            
                            <button type="submit" className="w-full py-4 bg-gradient-to-r from-pink-600 to-purple-600 rounded-xl font-bold text-lg shadow-lg hover:scale-[1.02] active:scale-95 transition-all">
                                開始投票 <i className="fas fa-arrow-right ml-2"></i>
                            </button>
                        </form>
                    </div>
                </div>
            );
        };

        // --- 排行榜組件 ---
        const ResultsView = ({ votes, onBack, totalVotes }) => {
            const sortedMemes = useMemo(() => {
                const counts = {};
                MEME_DATA.forEach(m => counts[m.id] = 0);
                Object.values(votes).forEach(choices => {
                    if (Array.isArray(choices)) choices.forEach(id => { if(counts[id] !== undefined) counts[id]++; });
                });
                return MEME_DATA.map(m => ({ ...m, count: counts[m.id] }))
                    .sort((a, b) => b.count - a.count || a.id - b.id);
            }, [votes]);
            const maxVotes = Math.max(...sortedMemes.map(m => m.count), 1);

            return (
                <div className="min-h-screen bg-slate-900 pt-16 px-4 pb-20">
                    <div className="max-w-2xl mx-auto">
                        <div className="flex justify-between items-center mb-8">
                            <button onClick={onBack} className="text-slate-400 hover:text-white px-4 py-2 rounded-xl bg-slate-800 transition"><i className="fas fa-arrow-left"></i> 返回</button>
                            <div className="text-slate-500 text-xs">總投票數: {totalVotes}</div>
                        </div>
                        <h2 className="text-3xl font-black text-center mb-10 bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-orange-500">🏆 即時戰況</h2>
                        <div className="space-y-3">
                            {sortedMemes.map((m, i) => (
                                <div key={m.id} className="relative glass-panel rounded-2xl p-4 flex items-center gap-4 overflow-hidden shadow-xl">
                                    <div className="absolute left-0 top-0 bottom-0 bg-pink-500/10 transition-all duration-1000" style={{width: `${(m.count/maxVotes)*100}%`}}></div>
                                    <div className={`w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg font-black text-lg ${i<3 ? 'bg-yellow-500 text-yellow-950' : 'bg-slate-700 text-slate-400'}`}>{i + 1}</div>
                                    <div className="w-14 h-11 rounded bg-slate-900 overflow-hidden flex-shrink-0 z-10"><img src={m.url} className="w-full h-full object-cover" /></div>
                                    <div className="flex-1 font-bold truncate z-10">{m.title}</div>
                                    <div className="text-right z-10"><span className="text-2xl font-black text-pink-400">{m.count}</span><span className="text-xs text-slate-500">票</span></div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [userName, setUserName] = useState(""); // 儲存使用者名字
            const [selectedIds, setSelectedIds] = useState([]);
            const [hasVoted, setHasVoted] = useState(false);
            const [viewResults, setViewResults] = useState(false);
            const [allVotes, setAllVotes] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [loading, setLoading] = useState(true);
            const MAX_VOTES = 3;

            // 監聽 Firebase 數據
            useEffect(() => {
                if (!db) return;
                const unsubscribe = db.collection(COLLECTION_PATH).onSnapshot(snapshot => {
                    const data = {};
                    snapshot.forEach(doc => data[doc.id] = doc.data().choices);
                    setAllVotes(data);
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // 處理登入（檢查是否投過票）
            const handleLogin = (name) => {
                setUserName(name);
                // 檢查這個名字是否已經在資料庫中
                if (allVotes[name]) {
                    setHasVoted(true);
                    setSelectedIds(allVotes[name]);
                    alert(`歡迎回來，${name}！您已經完成投票囉。`);
                }
            };

            const toggle = (id) => {
                if (hasVoted) return;
                if (selectedIds.includes(id)) setSelectedIds(prev => prev.filter(i => i !== id));
                else if (selectedIds.length < MAX_VOTES) setSelectedIds(prev => [...prev, id]);
            };

            const submit = async () => {
                if (selectedIds.length === 0 || isSubmitting) return;
                setIsSubmitting(true);
                try {
                    // 使用名字作為 Document ID，確保一個名字只能有一筆資料
                    await db.collection(COLLECTION_PATH).doc(userName).set({
                        choices: selectedIds,
                        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                        device: navigator.userAgent
                    });
                    setHasVoted(true);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } catch (e) {
                    alert("投票失敗：" + e.message);
                } finally {
                    setIsSubmitting(false);
                }
            };

            // ★★★ 管理員重置功能 ★★★
            const handleAdminReset = async () => {
                const pwd = prompt("請輸入管理員密碼以重置所有投票：");
                if (pwd === ADMIN_PASSWORD) {
                    if (confirm("⚠️ 警告：這將會刪除「所有」人的投票紀錄，無法復原！\n\n確定要執行嗎？")) {
                        setIsSubmitting(true);
                        try {
                            // 批次刪除
                            const snapshot = await db.collection(COLLECTION_PATH).get();
                            const batch = db.batch();
                            snapshot.docs.forEach((doc) => {
                                batch.delete(doc.ref);
                            });
                            await batch.commit();
                            alert("✅ 重置成功！所有票數已歸零。");
                            window.location.reload();
                        } catch (e) {
                            alert("重置失敗：" + e.message);
                        } finally {
                            setIsSubmitting(false);
                        }
                    }
                } else if (pwd) {
                    alert("密碼錯誤");
                }
            };

            if (loading) return <div className="h-screen flex items-center justify-center text-slate-500"><div className="loader mr-2"></div> 讀取數據中...</div>;

            // 如果還沒輸入名字，顯示登入頁面
            if (!userName && !viewResults) {
                return (
                    <div>
                         <LoginScreen onLogin={handleLogin} />
                         <div className="fixed bottom-4 right-4 text-slate-700 text-xs cursor-pointer hover:text-red-500 transition" onClick={handleAdminReset}>Admin Reset</div>
                    </div>
                );
            }

            if (viewResults) return <ResultsView votes={allVotes} onBack={() => setViewResults(false)} totalVotes={Object.keys(allVotes).length} />;

            return (
                <div className="min-h-screen bg-slate-900 text-white font-sans pb-40">
                    <header className="pt-10 pb-6 px-4 text-center relative">
                        <div className="flex justify-between items-center max-w-4xl mx-auto mb-4 px-2">
                             <div className="text-xs text-slate-500 font-mono">USER: {userName}</div>
                             <button onClick={() => setViewResults(true)} className="glass-panel text-yellow-400 text-xs px-4 py-2 rounded-full hover:bg-slate-800 transition flex items-center gap-2">
                                <i className="fas fa-chart-bar"></i> 戰況
                             </button>
                        </div>
                        <h1 className="text-4xl md:text-5xl font-black mb-2 bg-clip-text text-transparent bg-gradient-to-r from-pink-500 to-purple-500">資優班梗圖大賞</h1>
                        <p className="text-slate-400 text-sm">每人 3 票，選出年度經典！</p>
                    </header>

                    <main className="max-w-7xl mx-auto px-4">
                        {hasVoted ? (
                            <div className="max-w-md mx-auto glass-panel rounded-3xl p-10 text-center mt-10">
                                <div className="text-6xl mb-4">🎉</div>
                                <h2 className="text-2xl font-bold mb-2">投票完成！</h2>
                                <p className="text-slate-400 text-sm mb-8">感謝 {userName} 的參與</p>
                                <button onClick={() => setViewResults(true)} className="w-full py-3 bg-purple-600 rounded-xl font-bold shadow-lg">觀看排行榜</button>
                                <button onClick={() => window.location.reload()} className="mt-4 text-xs text-slate-500 hover:text-slate-300">切換使用者 (登出)</button>
                            </div>
                        ) : (
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-3">
                                {MEME_DATA.map((meme) => {
                                    const isSelected = selectedIds.includes(meme.id);
                                    const isLocked = selectedIds.length >= MAX_VOTES && !isSelected;
                                    return (
                                        <div key={meme.id} 
                                             className={`relative rounded-xl overflow-hidden cursor-pointer transition-all duration-200 group ${isSelected ? 'card-selected' : 'border border-white/5'} ${isLocked ? 'opacity-40 grayscale' : 'opacity-100'}`}
                                             onClick={() => toggle(meme.id)}>
                                            <div className="aspect-[4/3] bg-slate-950 relative">
                                                <img src={meme.url} className="w-full h-full object-cover" loading="lazy" />
                                                {isSelected && <div className="absolute inset-0 bg-pink-600/40 flex items-center justify-center"><i className="fas fa-check text-2xl text-white"></i></div>}
                                                <div className="absolute top-1 left-1 px-1.5 rounded bg-black/50 text-[10px] font-mono">#{meme.id}</div>
                                            </div>
                                            <div className={`p-2 text-center text-xs font-bold ${isSelected ? 'bg-pink-900/50 text-white' : 'bg-slate-800 text-slate-400'}`}>
                                                {isSelected ? '已選擇' : '點擊投票'}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </main>

                    {!hasVoted && (
                        <div className="fixed bottom-6 left-0 w-full flex justify-center px-4 pointer-events-none z-50">
                            <button onClick={submit} disabled={selectedIds.length === 0 || isSubmitting} 
                                className={`pointer-events-auto shadow-2xl px-8 py-3 rounded-full font-bold text-lg flex items-center gap-2 transition-all transform ${selectedIds.length > 0 ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white scale-105' : 'bg-slate-800 text-slate-500 opacity-80'}`}>
                                {isSubmitting ? '處理中...' : selectedIds.length > 0 ? `送出 ${selectedIds.length} 票` : '請選擇圖片'}
                            </button>
                        </div>
                    )}
                    
                    {/* 管理員重置按鈕 (在頁面最右下角，只有知道位置的人才按得到) */}
                    <div className="fixed bottom-2 right-2 text-slate-800 hover:text-red-800 cursor-pointer text-[10px] select-none" onClick={handleAdminReset}>
                        <i className="fas fa-trash"></i> Reset
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
