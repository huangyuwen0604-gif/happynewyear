<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 資優班年度梗圖大賞</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 隱藏捲軸但保留功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            background-color: #0f172a; /* matches slate-900 */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 圖示組件 (Inline Icons) ---
        // 為了在 Google Sites 單一檔案運作，我们将圖示直接寫在這邊，不依賴外部 import
        const Sparkles = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 3Z"/><path d="M20 4v6"/><path d="M22 7h-6"/><path d="M7 11v6"/><path d="M10 14H4"/></svg>
        );
        const Trophy = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        );
        const Check = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M20 6 9 17l-5-5"/></svg>
        );
        const PartyPopper = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5.8 11.3 2 22l10.7-3.79"/><path d="M4 3h.01"/><path d="M22 8h.01"/><path d="M15 2h.01"/><path d="M22 20h.01"/><path d="m22 2-2.24.75a2.9 2.9 0 0 0-1.96 1.96L17.04 7a2.9 2.9 0 0 1-1.96 1.96L12.28 9.72a2.9 2.9 0 0 1-1.96-1.96L9.56 5.52a2.9 2.9 0 0 1-1.96-1.96L6.84 2.8a2.9 2.9 0 0 0-1.96-1.96L2 0"/><path d="m8.29 13.79-2.5 2.5"/><path d="m11.59 10.49-2.5 2.5"/></svg>
        );
        const AlertCircle = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
        );

        // --- 設定區域 (請在這裡修改) ---

        // 【升級版】直接貼上 Google Drive 照片的「分享連結」即可！
        const PHOTO_LINKS = [
          "https://drive.google.com/file/d/1mCnYb4S1kuTe1B7YUoq6ArURQTe5qd1g/view?usp=sharing",
          "https://drive.google.com/file/d/1dUWWSVf9Onp0lLJrK07z1-dPE84vsOgj/view?usp=sharing",
          "https://drive.google.com/file/d/1BbNht3rZ9FKvth96cOnmi765_yJ5gybJ/view?usp=sharing",
          “https://drive.google.com/file/d/1dNKWF1iqWGLNdQ5N8VHZbLC3SPKasD5S/view?usp=sharing”,
          "https://drive.google.com/file/d/1BLogX7zHBvVKrYMS_wUbvXFS67oZ2RXy/view?usp=sharing",
          "https://drive.google.com/file/d/1Mst0-I1migSLI7EiSP1yHcRuCwc9z60R/view?usp=sharing",
          "https://drive.google.com/file/d/1ElsbKhTpNYvCm3o7bap4YAvhFMHZFXPR/view?usp=sharing",
          "https://drive.google.com/file/d/18yrSvjmGavaT026VooDxToRkYG6LmaLK/view?usp=sharing",
          "https://drive.google.com/file/d/1T24-fFroOs0cMfrj84S4i_oyu_LYbq7D/view?usp=sharing",
          "https://drive.google.com/file/d/1ZDpt6MguJUsax-UY34wIArflSnkf-Snf/view?usp=sharing",
          "https://drive.google.com/file/d/1G2jFPTQy9ehestEUquxi-Gh-7QH1HLpr/view?usp=sharing",
          "https://drive.google.com/file/d/1TWy8a0fh1iLhfJNX_SseRCNu95Az3Lze/view?usp=sharing",
          "https://drive.google.com/file/d/1HLG4OMUGsekOh2zeT6q2WprVgQR49qIi/view?usp=sharing",
          "https://drive.google.com/file/d/11WdXaj3aHuBmBdpPoZPUjGCZ7iqU0rbk/view?usp=sharing"

          
          // ... 請繼續貼上你的 38 張連結
        ];

        // 自訂每張照片的標題與描述 (選填)
        const CUSTOM_TEXTS = [
          { title: "神來一筆", desc: "這表情太有戲了" }, 
          { title: "午休時間", desc: "這睡姿...藝術" },   
        ];

        // --- 程式邏輯 (自動處理網址) ---

        const getSmartImageUrl = (input) => {
          if (!input) return null;
          if (!input.includes('drive.google.com')) return input;
          const idMatch = input.match(/\/d\/([a-zA-Z0-9_-]+)/);
          if (idMatch && idMatch[1]) {
            return `https://lh3.googleusercontent.com/d/${idMatch[1]}=s800`;
          }
          if (!input.includes('/')) {
             return `https://lh3.googleusercontent.com/d/${input}=s800`;
          }
          return null; 
        };

        // --- 以下為視覺與互動組件 ---

        const Fireworks = ({ isActive }) => {
          const canvasRef = useRef(null);
          useEffect(() => {
            if (!isActive) return;
            const canvas = canvasRef.current;
            const ctx = canvas.getContext('2d');
            let animationFrameId;
            let particles = [];
            const resizeCanvas = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            class Particle {
              constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.velocity = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 };
                this.alpha = 1; this.friction = 0.96; this.gravity = 0.04;
              }
              draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fillStyle = this.color; ctx.fill(); ctx.restore(); }
              update() { this.velocity.x *= this.friction; this.velocity.y *= this.friction; this.velocity.y += this.gravity; this.x += this.velocity.x; this.y += this.velocity.y; this.alpha -= 0.01; }
            }
            const createFirework = (x, y) => {
              const colors = ['#FFD700', '#FF1493', '#00FFFF', '#7FFF00', '#FF4500'];
              const color = colors[Math.floor(Math.random() * colors.length)];
              for (let i = 0; i < 50; i++) particles.push(new Particle(x, y, color));
            };
            const autoLaunch = setInterval(() => { createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.5); }, 500);
            const animate = () => {
              ctx.fillStyle = 'rgba(10, 10, 20, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
              particles.forEach((p, i) => { if (p.alpha > 0) { p.update(); p.draw(); } else { particles.splice(i, 1); } });
              animationFrameId = requestAnimationFrame(animate);
            };
            animate();
            return () => { window.removeEventListener('resize', resizeCanvas); clearInterval(autoLaunch); cancelAnimationFrame(animationFrameId); };
          }, [isActive]);
          if (!isActive) return null;
          return <canvas ref={canvasRef} className="fixed top-0 left-0 w-full h-full pointer-events-none z-50" />;
        };

        const CountdownTimer = () => {
          const [timeLeft, setTimeLeft] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
          useEffect(() => {
            const currentYear = new Date().getFullYear();
            const targetDate = new Date(`January 1, ${currentYear + 1} 00:00:00`).getTime();
            const interval = setInterval(() => {
              const now = new Date().getTime();
              const distance = targetDate - now;
              if (distance < 0) clearInterval(interval);
              else setTimeLeft({
                days: Math.floor(distance / (1000 * 60 * 60 * 24)),
                hours: Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)),
                minutes: Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)),
                seconds: Math.floor((distance % (1000 * 60)) / 1000),
              });
            }, 1000);
            return () => clearInterval(interval);
          }, []);
          return (
            <div className="flex justify-center space-x-4 mb-6 text-yellow-400 font-mono">
                <div className="text-center"><span className="block text-2xl md:text-3xl font-bold">{timeLeft.days}</span><span className="text-xs text-gray-400">天</span></div>
                <div className="text-center"><span className="block text-2xl md:text-3xl font-bold">{timeLeft.hours}</span><span className="text-xs text-gray-400">時</span></div>
                <div className="text-center"><span className="block text-2xl md:text-3xl font-bold">{timeLeft.minutes}</span><span className="text-xs text-gray-400">分</span></div>
                <div className="text-center"><span className="block text-2xl md:text-3xl font-bold animate-pulse">{timeLeft.seconds}</span><span className="text-xs text-gray-400">秒</span></div>
            </div>
          );
        };

        const MEME_DATA = Array.from({ length: 38 }, (_, i) => {
          const link = PHOTO_LINKS[i] || null;
          const imageUrl = getSmartImageUrl(link);
          const customText = CUSTOM_TEXTS[i] || {};
          return {
            id: i + 1,
            url: imageUrl, 
            bgColor: `hsl(${(i * 137) % 360}, 70%, 25%)`,
            title: customText.title || `年度梗圖 #${i + 1}`,
            desc: customText.desc || (i % 3 === 0 ? "笑死，這張太經典" : (i % 3 === 1 ? "資優班日常現狀" : "老師看了一定會瘋掉"))
          };
        });

        const ImageWithFallback = ({ src, alt, className }) => {
            const [error, setError] = useState(false);
            if (error) {
            return (
                <div className="w-full h-full bg-slate-800 flex flex-col items-center justify-center p-4 text-center">
                <AlertCircle className="w-8 h-8 text-red-400 mb-2" />
                <span className="text-xs text-red-300 font-mono">無法讀取圖片<br/>請確認 Google Drive<br/>權限是否設為公開</span>
                </div>
            );
            }
            return <img src={src} alt={alt} className={className} loading="lazy" referrerPolicy="no-referrer" onError={() => setError(true)} />;
        };

        function App() {
          const [selectedIds, setSelectedIds] = useState([]);
          const [hasVoted, setHasVoted] = useState(false);
          const [showFireworks, setShowFireworks] = useState(false);
          const [isSubmitting, setIsSubmitting] = useState(false);
          const MAX_VOTES = 3;

          const toggleSelection = (id) => {
            if (hasVoted) return;
            if (selectedIds.includes(id)) {
              setSelectedIds(selectedIds.filter(itemId => itemId !== id));
            } else {
              if (selectedIds.length >= MAX_VOTES) return;
              setSelectedIds([...selectedIds, id]);
            }
          };

          const handleSubmit = () => {
            if (selectedIds.length === 0) return;
            setIsSubmitting(true);
            setTimeout(() => {
              setIsSubmitting(false);
              setHasVoted(true);
              setShowFireworks(true);
              setTimeout(() => setShowFireworks(false), 8000);
            }, 1500);
          };

          return (
            <div className="min-h-screen bg-slate-900 text-white font-sans selection:bg-pink-500 selection:text-white pb-24">
              <Fireworks isActive={showFireworks} />
              <header className="relative pt-12 pb-8 px-4 text-center overflow-hidden">
                <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full h-64 bg-purple-600/20 blur-[100px] rounded-full pointer-events-none"></div>
                <div className="relative z-10 max-w-4xl mx-auto">
                  <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-yellow-400 text-sm mb-4 animate-bounce">
                    <Sparkles size={16} /> <span>跨年特別企劃</span>
                  </div>
                  <h1 className="text-4xl md:text-6xl font-black mb-4 tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 drop-shadow-[0_0_15px_rgba(168,85,247,0.5)]">
                    資優班年度梗圖大賞
                  </h1>
                  <p className="text-slate-400 text-lg mb-8 max-w-2xl mx-auto">
                    回顧這一年的崩潰與歡笑！選出你心目中最能代表資優班精神的 3 張年度梗圖！
                  </p>
                  <CountdownTimer />
                </div>
              </header>

              <main className="max-w-7xl mx-auto px-4">
                {hasVoted ? (
                  <div className="max-w-lg mx-auto bg-slate-800/80 backdrop-blur-lg border border-slate-700 rounded-2xl p-8 text-center shadow-2xl">
                    <div className="w-20 h-20 bg-green-500/20 rounded-full flex items-center justify-center mx-auto mb-6">
                      <PartyPopper className="text-green-400 w-10 h-10" />
                    </div>
                    <h2 className="text-3xl font-bold text-white mb-2">投票成功！</h2>
                    <p className="text-slate-300 mb-6">感謝你神聖的 {selectedIds.length} 票。結果將在跨年倒數後公佈！</p>
                    <button onClick={() => window.location.reload()} className="text-sm text-slate-500 hover:text-white underline cursor-pointer">重新投票 (測試用)</button>
                  </div>
                ) : (
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6">
                    {MEME_DATA.map((meme) => {
                      const isSelected = selectedIds.includes(meme.id);
                      const isMaxReached = selectedIds.length >= MAX_VOTES && !isSelected;
                      return (
                        <div 
                          key={meme.id}
                          onClick={() => toggleSelection(meme.id)}
                          className={`
                            group relative rounded-xl overflow-hidden cursor-pointer transition-all duration-300 transform
                            ${isSelected ? 'ring-4 ring-pink-500 shadow-[0_0_20px_rgba(236,72,153,0.6)] scale-[1.02] z-10' : 'hover:scale-105 hover:shadow-xl border border-slate-700 hover:border-slate-500'}
                            ${isMaxReached ? 'opacity-40 grayscale' : 'opacity-100'}
                          `}
                        >
                          <div 
                            className="aspect-[4/3] w-full flex items-center justify-center relative bg-slate-800 overflow-hidden"
                            style={{ backgroundColor: meme.url ? 'transparent' : meme.bgColor }}
                          >
                              {meme.url ? (
                                <ImageWithFallback 
                                  src={meme.url} 
                                  alt={meme.title} 
                                  className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" 
                                />
                              ) : (
                                <span className="text-4xl font-bold opacity-20 text-white select-none">#{meme.id}</span>
                              )}
                              <div className={`absolute inset-0 bg-pink-600/40 transition-opacity duration-200 flex items-center justify-center ${isSelected ? 'opacity-100' : 'opacity-0 group-hover:opacity-10'}`}>
                                 {isSelected && <Check className="w-12 h-12 text-white drop-shadow-lg scale-110" />}
                              </div>
                          </div>
                          <div className={`p-3 bg-slate-800 transition-colors ${isSelected ? 'bg-pink-900/30' : ''}`}>
                            <h3 className="font-bold text-slate-100 truncate">{meme.title}</h3>
                            <p className="text-xs text-slate-400 truncate">{meme.desc}</p>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </main>

              {!hasVoted && (
                <div className="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-slate-950 via-slate-900/90 to-transparent z-40">
                  <div className="max-w-2xl mx-auto">
                    <div className="flex items-center justify-between bg-slate-800/90 backdrop-blur border border-slate-600 p-2 pr-3 rounded-full shadow-2xl">
                      <div className="flex items-center gap-3 px-4">
                         <div className="text-sm md:text-base">
                           <span className="text-slate-400">已選擇: </span>
                           <span className={`font-bold ${selectedIds.length === MAX_VOTES ? 'text-pink-400' : 'text-white'}`}>{selectedIds.length}</span>
                           <span className="text-slate-500"> / {MAX_VOTES}</span>
                         </div>
                         <div className="hidden sm:block text-xs text-slate-500 border-l border-slate-600 pl-3">選出最讓你崩潰的 3 張</div>
                      </div>
                      <button onClick={handleSubmit} disabled={selectedIds.length === 0 || isSubmitting} className={`flex items-center gap-2 px-6 py-2.5 rounded-full font-bold transition-all duration-300 ${selectedIds.length > 0 ? 'bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-400 hover:to-purple-500 text-white shadow-[0_0_15px_rgba(236,72,153,0.5)] transform active:scale-95' : 'bg-slate-700 text-slate-400 cursor-not-allowed'}`}>
                        {isSubmitting ? <><span className="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"/>處理中...</> : <><Trophy size={18} />投出神聖一票</>}
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
