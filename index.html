<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2025 資優班年度梗圖大賞</title>
    
    <!-- 樣式與核心庫 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase 核心 (雲端連線用) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        body { background-color: #0f172a; color: white; margin: 0; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #ec4899; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>

    <div id="root">
        <div style="text-align: center; padding-top: 50px;">
            <div class="loader"></div>
            <h2>正在啟動投票系統...</h2>
        </div>
    </div>

    <script type="text/babel">
        // ==========================================
        //  👇👇👇 請在下方修改設定 👇👇👇
        // ==========================================

        // 1. 照片連結區 (已幫你整合之前貼上的 14 張連結)
        const PHOTO_LINKS = [
          "https://drive.google.com/file/d/1mCnYb4S1kuTe1B7YUoq6ArURQTe5qd1g/view?usp=sharing",
          "https://drive.google.com/file/d/1dUWWSVf9Onp0lLJrK07z1-dPE84vsOgj/view?usp=sharing",
          "https://drive.google.com/file/d/1BbNht3rZ9FKvth96cOnmi765_yJ5gybJ/view?usp=sharing",
          "https://drive.google.com/file/d/1dNKWF1iqWGLNdQ5N8VHZbLC3SPKasD5S/view?usp=sharing",
          "https://drive.google.com/file/d/1BLogX7zHBvVKrYMS_wUbvXFS67oZ2RXy/view?usp=sharing",
          "https://drive.google.com/file/d/1Mst0-I1migSLI7EiSP1yHcRuCwc9z60R/view?usp=sharing",
          "https://drive.google.com/file/d/1ElsbKhTpNYvCm3o7bap4YAvhFMHZFXPR/view?usp=sharing",
          "https://drive.google.com/file/d/18yrSvjmGavaT026VooDxToRkYG6LmaLK/view?usp=sharing",
          "https://drive.google.com/file/d/1T24-fFroOs0cMfrj84S4i_oyu_LYbq7D/view?usp=sharing",
          "https://drive.google.com/file/d/1ZDpt6MguJUsax-UY34wIArflSnkf-Snf/view?usp=sharing",
          "https://drive.google.com/file/d/1G2jFPTQy9ehestEUquxi-Gh-7QH1HLpr/view?usp=sharing",
          "https://drive.google.com/file/d/1TWy8a0fh1iLhfJNX_SseRCNu95Az3Lze/view?usp=sharing",
          "https://drive.google.com/file/d/1HLG4OMUGsekOh2zeT6q2WprVgQR49qIi/view?usp=sharing",
          "https://drive.google.com/file/d/11WdXaj3aHuBmBdpPoZPUjGCZ7iqU0rbk/view?usp=sharing",
          "", // 還有更多照片嗎？請繼續貼在引號中
          // ... 繼續貼
        ];

        // 2. 自訂文字區 (選填)
        const CUSTOM_TEXTS = [
          { title: "神來一筆", desc: "這表情太有戲了" }, 
        ];

        // 3. ★★★ Firebase 設定區 ★★★ 
        // 請把你在 Firebase 網頁複製的那一整段 "const firebaseConfig = { ... };" 
        // 直接貼在下面，取代掉原本的 null。
        
        const firebaseConfig = null; 

        /* 貼上後應該會長得像這樣：
           const firebaseConfig = {
               apiKey: "AIzaSyDxxxxxxxxx...",
               authDomain: "xxxx.firebaseapp.com",
               projectId: "xxxx",
               storageBucket: "xxxx.appspot.com",
               messagingSenderId: "123456...",
               appId: "1:123456..."
           };
        */

        // ==========================================
        //  系統核心 (以下不需要修改)
        // ==========================================

        let db = null;
        // 初始化檢查
        if (firebaseConfig) {
            try {
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                db = firebase.firestore();
                console.log("🔥 Firebase 連線成功！多人模式已啟動");
            } catch (e) {
                console.error("🔥 Firebase 設定有誤，請檢查貼上的程式碼", e);
            }
        } else {
            console.log("🟠 未偵測到 Firebase 設定，目前為單機演示模式");
        }

        const { useState, useEffect, useRef, useMemo } = React;

        const getSmartImageUrl = (input) => {
          if (!input) return null;
          input = input.trim();
          if (!input.includes('drive.google.com')) return input;
          const idMatch = input.match(/\/d\/([a-zA-Z0-9_-]+)/);
          if (idMatch && idMatch[1]) return `https://lh3.googleusercontent.com/d/${idMatch[1]}=s800`;
          if (!input.includes('/')) return `https://lh3.googleusercontent.com/d/${input}=s800`;
          return null; 
        };

        const MEME_DATA = Array.from({ length: 38 }, (_, i) => {
          const link = PHOTO_LINKS[i] || null;
          const imageUrl = getSmartImageUrl(link);
          const customText = CUSTOM_TEXTS[i] || {};
          return {
            id: i + 1,
            url: imageUrl, 
            bgColor: `hsl(${(i * 137) % 360}, 70%, 25%)`,
            title: customText.title || `年度梗圖 #${i + 1}`,
            desc: customText.desc || " "
          };
        });

        const Icons = {
            Sparkles: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 3.214L13 21l-2.286-6.857L5 12l5.714-3.214L13 3z" /></svg>,
            Trophy: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
            Chart: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>,
            Back: () => <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
        };

        const ResultsView = ({ votes, onBack, isCloudMode }) => {
            const sortedMemes = useMemo(() => {
                const counts = {};
                MEME_DATA.forEach(m => counts[m.id] = 0);
                Object.values(votes).forEach(voteList => {
                    if (Array.isArray(voteList)) {
                        voteList.forEach(id => {
                            if (counts[id] !== undefined) counts[id]++;
                        });
                    }
                });
                return MEME_DATA.map(m => ({ ...m, count: counts[m.id] })).sort((a, b) => b.count - a.count);
            }, [votes]);
            const totalVotes = Object.keys(votes).length;

            return (
                <div className="min-h-screen bg-slate-900 pt-20 px-4 pb-10">
                    <div className="max-w-4xl mx-auto">
                        <div className="flex items-center justify-between mb-8">
                            <button onClick={onBack} className="flex items-center gap-2 text-slate-400 hover:text-white transition"><Icons.Back /> 返回投票</button>
                            <div className="flex items-center gap-2">
                                <div className={`w-3 h-3 rounded-full ${isCloudMode ? 'bg-green-500 shadow-[0_0_10px_#22c55e]' : 'bg-yellow-500'}`}></div>
                                <span className="text-sm text-slate-400">{isCloudMode ? '雲端即時連線中' : '單機演示模式'}</span>
                            </div>
                        </div>
                        <h2 className="text-3xl font-bold text-center mb-2 bg-clip-text text-transparent bg-gradient-to-r from-yellow-400 to-orange-500">🏆 即時戰況排行榜</h2>
                        <p className="text-center text-slate-500 mb-10">目前總投票人數：{totalVotes} 人</p>
                        <div className="grid gap-4">
                            {sortedMemes.map((meme, index) => (
                                <div key={meme.id} className="bg-slate-800/50 border border-slate-700 rounded-lg p-4 flex items-center gap-4 relative overflow-hidden">
                                    <div className="absolute left-0 top-0 bottom-0 bg-purple-600/10 transition-all duration-1000" style={{ width: `${(meme.count / (totalVotes * 3 || 1)) * 100}%` }}></div>
                                    <div className={`w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-full font-bold text-lg ${index === 0 ? 'bg-yellow-500 text-yellow-950' : index === 1 ? 'bg-slate-300 text-slate-900' : index === 2 ? 'bg-orange-700 text-orange-100' : 'bg-slate-700 text-slate-400'}`}>{index + 1}</div>
                                    <div className="w-16 h-12 rounded bg-slate-900 overflow-hidden flex-shrink-0">
                                        {meme.url ? <img src={meme.url} className="w-full h-full object-cover" /> : <div className="w-full h-full" style={{backgroundColor: meme.bgColor}}></div>}
                                    </div>
                                    <div className="flex-1 min-w-0 z-10"><h3 className="font-bold truncate">{meme.title}</h3><p className="text-xs text-slate-400">ID: #{meme.id}</p></div>
                                    <div className="text-right z-10"><span className="text-2xl font-bold text-pink-400">{meme.count}</span><span className="text-xs text-slate-500 ml-1">票</span></div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        function App() {
            const [selectedIds, setSelectedIds] = useState([]);
            const [hasVoted, setHasVoted] = useState(false);
            const [viewResults, setViewResults] = useState(false);
            const [allVotes, setAllVotes] = useState({});
            const [isCloudMode, setIsCloudMode] = useState(false);
            const MAX_VOTES = 3;
            const userId = useMemo(() => {
                let id = localStorage.getItem('user_id');
                if (!id) { id = 'user_' + Math.random().toString(36).substr(2, 9); localStorage.setItem('user_id', id); }
                return id;
            }, []);

            useEffect(() => {
                if (db) {
                    setIsCloudMode(true);
                    const unsubscribe = db.collection('votes').onSnapshot(snapshot => {
                        const newVotes = {};
                        snapshot.forEach(doc => { newVotes[doc.id] = doc.data().choices; });
                        setAllVotes(newVotes);
                    }, e => console.error("Firebase 讀取失敗:", e));
                    
                    if (localStorage.getItem('voted_2025')) {
                        setHasVoted(true);
                        setSelectedIds(JSON.parse(localStorage.getItem('my_votes') || '[]'));
                    }
                    return () => unsubscribe();
                } else {
                    const savedVotes = JSON.parse(localStorage.getItem('local_votes') || '{}');
                    setAllVotes(savedVotes);
                    if (localStorage.getItem('voted_2025')) {
                        setHasVoted(true);
                        setSelectedIds(JSON.parse(localStorage.getItem('my_votes') || '[]'));
                    }
                }
            }, []);

            const toggleSelection = (id) => {
                if (hasVoted) return;
                if (selectedIds.includes(id)) setSelectedIds(selectedIds.filter(itemId => itemId !== id));
                else { if (selectedIds.length >= MAX_VOTES) return; setSelectedIds([...selectedIds, id]); }
            };

            const handleSubmit = async () => {
                if (selectedIds.length === 0) return;
                if (db) {
                    try {
                        await db.collection('votes').doc(userId).set({
                            choices: selectedIds,
                            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                            deviceInfo: navigator.userAgent
                        });
                    } catch (e) {
                        alert("上傳失敗: " + e.message + "\n請確認 Firestore 是否已建立並設為 Test Mode");
                        return;
                    }
                } else {
                    const currentVotes = JSON.parse(localStorage.getItem('local_votes') || '{}');
                    currentVotes[userId] = selectedIds;
                    localStorage.setItem('local_votes', JSON.stringify(currentVotes));
                    setAllVotes(currentVotes);
                }
                localStorage.setItem('voted_2025', 'true');
                localStorage.setItem('my_votes', JSON.stringify(selectedIds));
                setHasVoted(true);
            };

            const handleReset = () => {
                if(confirm('確定要清除本機所有投票資料嗎？')) {
                    localStorage.removeItem('voted_2025');
                    localStorage.removeItem('local_votes');
                    localStorage.removeItem('my_votes');
                    localStorage.removeItem('user_id');
                    window.location.reload();
                }
            };

            if (viewResults) return <ResultsView votes={allVotes} onBack={() => setViewResults(false)} isCloudMode={isCloudMode} />;

            return (
                <div className="min-h-screen bg-slate-900 text-white font-sans pb-24">
                    <header className="relative pt-10 pb-6 px-4 text-center">
                        <div className="flex justify-between items-center max-w-7xl mx-auto absolute top-4 right-4 left-4 z-50">
                             <div className="text-xs text-slate-600 cursor-pointer" onClick={handleReset}>重置</div>
                             <button onClick={() => setViewResults(true)} className="bg-slate-800 hover:bg-slate-700 text-yellow-400 text-sm px-4 py-2 rounded-full border border-slate-700 flex items-center gap-2 transition"><Icons.Chart /> 即時戰況</button>
                        </div>
                        <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-800 border border-slate-700 text-pink-400 text-sm mb-4"><Icons.Sparkles /> <span>跨年特別企劃</span></div>
                        <h1 className="text-4xl md:text-5xl font-black tracking-tight mb-2 bg-clip-text text-transparent bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500">資優班梗圖大賞</h1>
                        <p className="text-slate-400">每人 3 票，選出年度最經典！<span className="block text-xs mt-1 text-slate-600">{isCloudMode ? '🟢 雲端連線中' : '🟠 單機模式'}</span></p>
                    </header>
                    <main className="max-w-7xl mx-auto px-4">
                        {hasVoted ? (
                            <div className="max-w-md mx-auto bg-slate-800 border border-slate-700 rounded-2xl p-8 text-center mt-10">
                                <div className="text-5xl mb-4">🎉</div><h2 className="text-2xl font-bold mb-2">投票成功！</h2><p className="text-slate-400 mb-6">坐等結果出爐...</p>
                                <button onClick={() => setViewResults(true)} className="w-full py-3 bg-purple-600 hover:bg-purple-500 rounded-xl font-bold transition">查看目前排名</button>
                            </div>
                        ) : (
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                                {MEME_DATA.map((meme) => {
                                    const isSelected = selectedIds.includes(meme.id);
                                    const isMaxReached = selectedIds.length >= MAX_VOTES && !isSelected;
                                    return (
                                        <div key={meme.id} onClick={() => toggleSelection(meme.id)} className={`relative rounded-xl overflow-hidden cursor-pointer transition-all duration-200 ${isSelected ? 'ring-4 ring-pink-500 scale-[0.98]' : 'hover:scale-[1.02] border border-slate-700'} ${isMaxReached ? 'opacity-50 grayscale' : 'opacity-100'}`}>
                                            <div className="aspect-[4/3] bg-slate-800 relative">
                                                {meme.url ? <img src={meme.url} className="w-full h-full object-cover" loading="lazy" /> : <div className="w-full h-full flex items-center justify-center text-slate-600 font-bold text-2xl" style={{backgroundColor: meme.bgColor}}>#{meme.id}</div>}
                                                {isSelected && <div className="absolute inset-0 bg-pink-500/40 flex items-center justify-center"><div className="bg-white rounded-full p-2 text-pink-600"><Icons.Trophy /></div></div>}
                                            </div>
                                            <div className={`p-2 bg-slate-800 text-sm ${isSelected && 'bg-pink-900/30'}`}><div className="font-bold truncate text-slate-200">{meme.title}</div></div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}
                    </main>
                    {!hasVoted && (
                        <div className="fixed bottom-6 left-0 w-full flex justify-center px-4 pointer-events-none z-50">
                            <button onClick={handleSubmit} disabled={selectedIds.length === 0} className={`pointer-events-auto shadow-2xl px-8 py-3 rounded-full font-bold text-lg flex items-center gap-2 transition-all transform ${selectedIds.length > 0 ? 'bg-gradient-to-r from-pink-500 to-purple-600 text-white scale-100' : 'bg-slate-700 text-slate-500 scale-95'}`}>
                                {selectedIds.length > 0 ? `投出 ${selectedIds.length} 票` : '請選擇圖片'}
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
